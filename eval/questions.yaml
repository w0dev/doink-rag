# Eval questions over the doink-brain / doink-rag documentation corpus.
#
# expect_paths   — the document(s) that should be retrieved (document-level recall)
# expect_phrase  — a distinctive string that must appear in the CORRECT chunk.
#                  Document-level recall over an 8-document corpus is nearly free;
#                  chunk-level is where fusion dilution actually shows.
# kind           — which arm this question is designed to favour, so per-arm
#                  behaviour can be read rather than guessed:
#                    vocab   = vocabulary mismatch; the answer uses different
#                              words than the question (dense should win)
#                    exact   = literal identifier, flag, or tag (keyword should win)
#                    natural = ordinary multi-word phrasing (the AND-join failure case)

# ---- vocabulary mismatch: dense arm should carry these ----
- question: why does the box get slow when memory runs short
  expect_paths: [architecture.md]
  expect_phrase: "memory-fit problem"
  kind: vocab

- question: what stops the model being pushed out to disk during generation
  expect_paths: [architecture.md]
  expect_phrase: "no-repack"
  kind: vocab

- question: why is a graphics card not used for this workload
  expect_paths: [architecture.md]
  expect_phrase: "bandwidth-bound"
  kind: vocab

- question: what makes this model small enough to run at a usable speed
  expect_paths: [architecture.md]
  expect_phrase: "MoE shape"
  kind: vocab

- question: how does anything outside the house reach the service
  expect_paths: [architecture.md]
  expect_phrase: "tailscale serve"
  kind: vocab

- question: what protects against a key someone added behind my back
  expect_paths: [baseline-hardening-spec.md]
  expect_phrase: "exclusive"
  kind: vocab

- question: why is storing everything in one file enough here
  expect_paths: [rag-design-spec.md]
  expect_phrase: "Qdrant"
  kind: vocab

- question: what breaks if the served model is swapped without warning
  expect_paths: [rag-design-spec.md]
  expect_phrase: "rebuild"
  kind: vocab

